<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexTask | Modern Project Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Auth Section -->
    <section id="auth-section" class="auth-container">
        <!-- Login Card -->
        <div id="login-card" class="auth-card glass-panel fade-in">
            <h1 class="auth-title">NexTask</h1>
            <p class="auth-subtitle">Sign in to manage your projects</p>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" class="form-input" required placeholder="john_doe">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
            <div class="auth-switch">
                Don't have an account? <a href="#" onclick="toggleAuth()">Sign Up</a>
            </div>
        </div>

        <!-- Signup Card -->
        <div id="signup-card" class="auth-card glass-panel fade-in" style="display: none;">
            <h1 class="auth-title">Join NexTask</h1>
            <p class="auth-subtitle">Create your collaborative workspace</p>
            <form id="signup-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signup-username" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signup-email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="signup-role" class="form-input">
                        <option value="MEMBER">Member</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
            <div class="auth-switch">
                Already have an account? <a href="#" onclick="toggleAuth()">Sign In</a>
            </div>
        </div>
    </section>

    <!-- App Section -->
    <main id="app-section" class="app-container">
        <aside class="sidebar">
            <h2 class="auth-title" style="font-size: 1.5rem; text-align: left; margin-bottom: 2rem;">NexTask</h2>
            <nav>
                <div class="nav-item active" onclick="showDashboard()">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </div>
                <div class="nav-item" onclick="showProjects()">
                    <i data-lucide="folder"></i> Projects
                </div>
                <div class="nav-item" onclick="showTasks()">
                    <i data-lucide="check-square"></i> My Tasks
                </div>
                <div id="admin-nav" class="nav-item" onclick="showTeam()" style="display: none;">
                    <i data-lucide="users"></i> Team
                </div>
            </nav>
            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                <p id="user-display" style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;"></p>
                <div class="nav-item" onclick="logout()">
                    <i data-lucide="log-out"></i> Logout
                </div>
            </div>
        </aside>

        <section class="main-content">
            <div id="dashboard-view">
                <div class="header">
                    <h1>Dashboard</h1>
                </div>
                <div class="project-grid" id="dashboard-stats">
                    <!-- Stats will be loaded here -->
                </div>
            </div>

            <div id="projects-view" style="display: none;">
                <div class="header">
                    <h1>Projects</h1>
                    <button class="btn btn-primary" style="width: auto;" onclick="openModal('project-modal')" id="create-project-btn">New Project</button>
                </div>
                <div class="project-grid" id="projects-list">
                    <!-- Projects will be loaded here -->
                </div>
            </div>

            <div id="tasks-view" style="display: none;">
                <div class="header">
                    <h1>Tasks</h1>
                </div>
                <div class="task-list" id="tasks-list">
                    <!-- Tasks will be loaded here -->
                </div>
            </div>

            <div id="project-detail-view" style="display: none;">
                <div class="header">
                    <h1 id="current-project-name">Project Name</h1>
                    <button class="btn btn-primary" style="width: auto;" onclick="openModal('task-modal')" id="create-task-btn">Add Task</button>
                </div>
                <p id="current-project-desc" style="color: var(--text-muted); margin-bottom: 2rem;"></p>
                <div class="task-list" id="project-tasks-list">
                    <!-- Project specific tasks -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="project-modal" class="modal">
        <div class="modal-content glass-panel fade-in">
            <h2 style="margin-bottom: 1.5rem;">Create New Project</h2>
            <form id="project-form">
                <div class="form-group">
                    <label>Project Name</label>
                    <input type="text" id="project-name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="project-desc" class="form-input" style="height: 100px;"></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="button" class="btn" style="background: var(--glass);" onclick="closeModal('project-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <div id="task-modal" class="modal">
        <div class="modal-content glass-panel fade-in">
            <h2 style="margin-bottom: 1.5rem;">Add New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text" id="task-title" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="task-desc" class="form-input"></textarea>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select id="task-priority" class="form-input">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="task-date" class="form-input">
                </div>
                <div class="form-group">
                    <label>Assignee</label>
                    <select id="task-assignee" class="form-input">
                        <!-- Loaded dynamically -->
                    </select>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="button" class="btn" style="background: var(--glass);" onclick="closeModal('task-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
